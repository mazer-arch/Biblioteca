<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Biblioteca</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#e8f0ee;--card:#fbfdfc;--ink:#2a2118;--mute:#6d6354;--teal:#3f9a9a;--teal-d:#2c7173;--line:#d3ddd9;--sky1:#d6ebe9;--sky2:#f1f6f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201f;--card:#182d2c;--ink:#f1e8d8;--mute:#a99f8d;--line:#294341;--sky1:#1d3d3b;--sky2:#142726}}
:root[data-theme="dark"]{--bg:#10201f;--card:#182d2c;--ink:#f1e8d8;--mute:#a99f8d;--line:#294341;--sky1:#1d3d3b;--sky2:#142726}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;font-weight:600}
.sub{color:var(--mute);margin:0 0 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.stage{position:relative;aspect-ratio:1/1.05;border-radius:14px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.roofbtn{position:absolute;top:10px;right:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.hint{position:absolute;left:10px;bottom:10px;font-size:13px;color:var(--mute);background:var(--card);border-radius:10px;padding:4px 10px;transition:opacity .6s;pointer-events:none}
.nogl{padding:30px 16px;text-align:center;color:var(--mute)}
.prog{margin-top:12px}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:8px;transition:width .5s}
.prog p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.add{margin-top:14px;display:grid;gap:8px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--teal-d);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:500}
.list{margin-top:14px}
.list h2{font-size:17px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.dot{width:12px;height:30px;border-radius:3px;flex:none}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute);display:block}
.x{background:none;border:0;color:var(--mute);font-size:20px;padding:6px 10px}
.empty{color:var(--mute);margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"],.pb button[aria-pressed="true"]{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button,.pb button{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;min-width:44px}
.prev{margin-top:12px}
.pb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pcap{margin:8px 0 0;font-size:14px;color:var(--mute)}
.row .acts{flex:none;display:flex;align-items:center;gap:4px}
.mini{background:none;border:1px solid var(--line);color:var(--teal-d);border-radius:10px;padding:6px 8px;font-size:13px}
.cv{width:30px;height:42px;object-fit:cover;border-radius:4px;flex:none;border:1px solid var(--line)}
.st{color:#d9a441;letter-spacing:1px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.pick{display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--mute);cursor:pointer;font-size:15px;text-align:center;position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick:focus-within{outline:3px solid var(--teal);outline-offset:2px}
.stars{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 10px}
.stars span{font-size:14px;color:var(--mute)}
.stars button{background:none;border:0;font-size:26px;color:#d9a441;padding:6px 4px;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}.ser{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;color:var(--mute);font-size:14px}.ser input{width:58px;padding:6px 8px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Minha Biblioteca</h1>
<div class="tabs" id="top" role="tablist" aria-label="Coleção"><button data-c="f" role="tab">Filmes</button><button data-c="s" role="tab">Séries</button><button data-c="l" role="tab">Livros</button></div>
<p class="sub" id="lvlName"></p>
<div class="tabs" role="tablist"><button id="tbL" role="tab" aria-selected="true">Biblioteca</button><button id="tbR" role="tab" aria-selected="false">Para ler</button></div>
<div id="tabLidos">
<div class="card"><div class="stage" id="stage"><button class="roofbtn" id="roofBtn">Ver telhado</button><div class="hint" id="hint">Arraste para girar · pince para ampliar</div></div></div>

<div class="card prog"><div class="bar"><i id="fill"></i></div><p id="progTxt"></p></div>
<div class="card add">
<input id="t" placeholder="Título do livro" autocomplete="off">
<input id="a" placeholder="Autor (opcional)" autocomplete="off">
<div class="fields" id="sf" hidden><input id="ss" type="number" min="1" inputmode="numeric" placeholder="Temporada" aria-label="Temporada"><input id="se" type="number" min="0" inputmode="numeric" placeholder="Episódio" aria-label="Episódio"></div><div class="fields"><input id="d" type="date" aria-label="Data"><label class="pick"><input id="c" type="file" accept="image/*"><span id="cn">Adicionar capa</span></label></div>
<div class="stars" id="stars" role="group" aria-label="Nota"><span>Nota</span><button type="button" data-s="1" aria-label="1 estrela">☆</button><button type="button" data-s="2" aria-label="2 estrelas">☆</button><button type="button" data-s="3" aria-label="3 estrelas">☆</button><button type="button" data-s="4" aria-label="4 estrelas">☆</button><button type="button" data-s="5" aria-label="5 estrelas">☆</button></div>
<button class="btn" id="go">Adicionar à estante</button>
</div>
<div class="card list"><h2 id="hList">Livros lidos</h2><div id="list"></div></div>
<div class="card list"><h2>Backup</h2><p class="pcap">Guarda filmes, séries e livros (com capas, notas e temporadas) e as listas “Para ler” em um arquivo, para restaurar em outro aparelho.</p><div class="fields" style="margin-top:8px"><button class="btn" id="bkOut" type="button">Exportar backup</button><label class="pick"><input id="bkIn" type="file" accept=".json,application/json"><span>Importar backup</span></label></div></div>
</div>
<div id="tabLer" hidden>
<div class="card add">
<input id="wt" placeholder="Título do livro" autocomplete="off">
<input id="wa" placeholder="Autor (opcional)" autocomplete="off">
<div class="seg" id="wseg"><button type="button" data-k="i" aria-pressed="true">Tenho interesse</button><button type="button" data-k="p" aria-pressed="false" id="wsP">Já tenho, não li</button></div>
<button class="btn" id="wgo">Adicionar à lista</button>
</div>
<div class="card list"><h2 id="hwP">Já tenho, ainda não li</h2><div id="wlP"></div></div>
<div class="card list"><h2>Tenho interesse</h2><div id="wlI"></div></div>
</div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

var col="l",C=CF.l,wish=ld(C.wk),ST={l:{b:books,w:wish},f:{b:ld(CF.f.key),w:ld(CF.f.wk)},s:{b:ld(CF.s.key),w:ld(CF.s.wk)}};

/* ---------- 3D ---------- */

function tab(n){$("tabLidos").hidden=n!=="l";$("tabLer").hidden=n!=="r";$("tbL").setAttribute("aria-selected",n==="l"?"true":"false");$("tbR").setAttribute("aria-selected",n==="r"?"true":"false")}
function segPaint(){var b=document.querySelectorAll("#wseg button");for(var i=0;i<b.length;i++)b[i].setAttribute("aria-pressed",b[i].getAttribute("data-k")===wk?"true":"false")}
function renderW(){["p","i"].forEach(function(k){var h="",c=0;for(var i=wish.length-1;i>=0;i--){var x=wish[i];if(x.k!==k)continue;c++;
h+='<div class="row"><div><b>'+esc(x.t)+'</b><small>'+esc(x.a||C.na)+'</small></div><div class="acts">'+(k==="i"?'<button class="mini" data-mv="'+i+'">Já tenho</button>':'')+'<button class="mini" data-rd="'+i+'">'+C.rd+'</button><button class="x" data-wd="'+i+'" aria-label="Remover '+esc(x.t)+'">×</button></div></div>'}
$(k==="p"?"wlP":"wlI").innerHTML=c?h:'<p class="empty">'+(k==="p"?"Nada aqui. Os que você já tem e ainda não "+C.v+" ficam nesta lista.":"Nada aqui. Anote o que você quer "+C.vi+".")+'</p>'})}
function markRead(i){var x=wish[i];if(!x)return;var before=lvlOf(books.length);books.push({t:x.t,a:x.a,d:Date.now(),r:0,w:today(),c:"",s:1,e:0});save();wish.splice(i,1);saveW();render();renderW();var after=lvlOf(books.length);toast(after>before?"A casa evoluiu: "+NAMES[after]+"!":"“"+x.t+"” foi para a estante.")}
var rating=0,cover="";
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(s){if(!s)return"";var p=String(s).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:""}
function starTxt(r){return r?"★★★★★".slice(0,r)+"☆☆☆☆☆".slice(0,5-r):""}
function paintStars(){var b=document.querySelectorAll("#stars button");for(var i=0;i<b.length;i++){b[i].textContent=i<rating?"★":"☆";b[i].setAttribute("aria-pressed",i<rating?"true":"false")}}
function resetExtra(){rating=0;cover="";$("d").value=today();$("c").value="";$("ss").value="";$("se").value="";$("cn").textContent="Adicionar capa";paintStars()}
function add(){
var t=$("t").value.trim(),a=$("a").value.trim();
if(!t){toast("Digite o título do livro.");$("t").focus();return}
var before=lvlOf(books.length);
var o={t:t,a:a,d:Date.now(),r:rating,w:$("d").value||today(),c:cover};if(col==="s"){o.s=Math.max(1,Math.floor(+$("ss").value)||1);o.e=Math.max(0,Math.floor(+$("se").value)||0);o.u=today()}books.push(o);save();
$("t").value="";$("a").value="";resetExtra();
render();
var after=lvlOf(books.length);
toast(after>before?"A casa evoluiu: "+NAMES[after]+"!":"“"+t+"” entrou na estante.")}

$("go").addEventListener("click",add);
$("top").addEventListener("click",function(e){var k=e.target.getAttribute("data-c");if(k&&k!==col)setCol(k)});
$("list").addEventListener("click",function(e){var t=e.target,i,b;
if((i=t.getAttribute("data-ep"))!==null&&(b=books[+i])){b.e=(+b.e||0)+1;b.u=today();save();render();toast(b.t+": T"+(+b.s||1)+" E"+b.e)}
else if((i=t.getAttribute("data-ns"))!==null&&(b=books[+i])){b.s=(+b.s||1)+1;b.e=1;b.u=today();save();render();toast(b.t+": temporada "+b.s+" iniciada.")}});
$("list").addEventListener("change",function(e){var t=e.target,i,b;
if((i=t.getAttribute("data-ts"))!==null&&(b=books[+i]))b.s=Math.max(1,Math.floor(+t.value)||1);
else if((i=t.getAttribute("data-te"))!==null&&(b=books[+i]))b.e=Math.max(0,Math.floor(+t.value)||0);else return;
b.u=today();save();render()});
$("tbL").addEventListener("click",function(){tab("l")});$("tbR").addEventListener("click",function(){tab("r")});

$("wgo").addEventListener("click",function(){var t=$("wt").value.trim();if(!t){toast("Digite o título do livro.");$("wt").focus();return}wish.push({t:t,a:$("wa").value.trim(),k:wk});saveW();$("wt").value="";$("wa").value="";renderW();toast("“"+t+"” entrou na lista.")});
$("tabLer").addEventListener("click",function(e){var t=e.target,a;
if((a=t.getAttribute("data-mv"))!==null){wish[+a].k="p";saveW();renderW()}
else if((a=t.getAttribute("data-rd"))!==null){markRead(+a)}
else if((a=t.getAttribute("data-wd"))!==null){var x=wish[+a];if(x&&confirm("Remover “"+x.t+"” da lista?")){wish.splice(+a,1);saveW();renderW()}}
else if(t.getAttribute("data-k")){wk=t.getAttribute("data-k");segPaint()}});
renderW();segPaint();
$("stars").addEventListener("click",function(e){var s=+e.target.getAttribute("data-s");if(!s)return;rating=rating===s?0:s;paintStars()});
$("c").addEventListener("change",function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,160/im.height),cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cover=cv.toDataURL("image/jpeg",0.7);$("cn").textContent="Capa adicionada ✓"};im.src=rd.result};rd.readAsDataURL(f)});
resetExtra();
$("a").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("t").addEventListener("keydown",function(e){if(e.key==="Enter")$("a").focus()});
$("list").addEventListener("click",function(e){var d=e.target.getAttribute("data-del");
if(d===null)return;var b=books[+d];if(b&&confirm("Remover “"+b.t+"” da biblioteca?")){books.splice(+d,1);save();render()}});

$("bkOut").addEventListener("click",function(){
var data=JSON.stringify({app:"minha-biblioteca",v:2,exportado:new Date().toISOString(),livros:ST.l.b,lista:ST.l.w,filmes:ST.f.b,filmesLista:ST.f.w,series:ST.s.b,seriesLista:ST.s.w});
var p=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
p.then(function(dl){if(!dl){var bl=new Blob([data],{type:"application/json"}),an=document.createElement("a");an.href=URL.createObjectURL(bl);an.download="backup-biblioteca-"+today()+".json";document.body.appendChild(an);an.click();an.remove();toast("Backup gerado.");return}
return dl.save({filename:"backup-biblioteca-"+today()+".json",data:data}).then(function(){toast("Backup salvo.")})
}).catch(function(e){if(e&&e.code==="declined")return;toast("Não foi possível salvar o backup.")})});
$("bkIn").addEventListener("change",function(){var f=this.files&&this.files[0],inp=this;if(!f)return;var rd=new FileReader();
rd.onload=function(){inp.value="";try{var o=JSON.parse(rd.result);
if(!o||!Array.isArray(o.livros)||!Array.isArray(o.lista))throw 0;
var ok=function(x){return x&&typeof x.t==="string"&&x.t};
var nb=o.livros.filter(ok).map(function(x){return{t:String(x.t).slice(0,200),a:String(x.a||"").slice(0,200),d:+x.d||Date.now(),r:clamp(+x.r||0,0,5),w:/^\d{4}-\d{2}-\d{2}$/.test(x.w||"")?x.w:"",c:typeof x.c==="string"&&x.c.indexOf("data:image/")===0?x.c:""}});
var nw=o.lista.filter(ok).map(function(x){return{t:String(x.t).slice(0,200),a:String(x.a||"").slice(0,200),k:x.k==="p"?"p":"i"}});
var cl=function(a,sr){return a.filter(ok).map(function(x){var r={t:String(x.t).slice(0,200),a:String(x.a||"").slice(0,200),d:+x.d||Date.now(),r:clamp(+x.r||0,0,5),w:/^\d{4}-\d{2}-\d{2}$/.test(x.w||"")?x.w:"",c:typeof x.c==="string"&&x.c.indexOf("data:image/")===0?x.c:""};if(sr){r.s=Math.max(1,Math.floor(+x.s)||1);r.e=Math.max(0,Math.floor(+x.e)||0);r.u=/^\d{4}-\d{2}-\d{2}$/.test(x.u||"")?x.u:""}return r})};
var cw=function(a){return a.filter(ok).map(function(x){return{t:String(x.t).slice(0,200),a:String(x.a||"").slice(0,200),k:x.k==="p"?"p":"i"}})};
var nf=Array.isArray(o.filmes)?cl(o.filmes):ST.f.b,nfw=Array.isArray(o.filmesLista)?cw(o.filmesLista):ST.f.w,ns=Array.isArray(o.series)?cl(o.series,1):ST.s.b,nsw=Array.isArray(o.seriesLista)?cw(o.seriesLista):ST.s.w;
if(!confirm("Substituir os dados atuais por este backup? Ele tem "+nb.length+" livros, "+nf.length+" filmes e "+ns.length+" séries, além das listas."))return;
ST.l={b:nb,w:nw};ST.f={b:nf,w:nfw};ST.s={b:ns,w:nsw};Object.keys(CF).forEach(function(k){try{localStorage.setItem(CF[k].key,JSON.stringify(ST[k].b));localStorage.setItem(CF[k].wk,JSON.stringify(ST[k].w))}catch(e){}});setCol(col);toast("Backup restaurado.")}catch(e){toast("Esse arquivo não parece um backup válido.")}};
rd.readAsText(f)});
var s0="f";try{s0=localStorage.getItem("biblioteca-aba")||"f"}catch(e){}setCol(CF[s0]?s0:"f");
if(typeof THREE!=="undefined"&&initGL()){bindInput();render();renderer.setAnimationLoop(tick)}
else{if(typeof THREE==="undefined")stage.innerHTML='<div class="nogl">Não foi possível carregar o 3D. Verifique a conexão e recarregue.</div>';render()}
})();
</script>
</body>
</html>
